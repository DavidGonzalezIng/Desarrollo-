<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo</title>

    <style>
        body {
            background-color: #10251c;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            color: #39ff88;
            font-size: 40px;
        }

        p {
            color: #c4e8d2;
            font-size: 20px;
        }

        button {
            background-color: #176b45;
            color: white;
            border: 2px solid #39ff88;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #23965e;
        }
    </style>
</head>
<body>

    <h1>🐈‍⬛ Hola, mundo</h1>

    <p>¡Holaaaaaa! Bienvenido al mundo de los gatos.</p>

    <button onclick="alert('¡Miau! 🐾💚')">
        Haz clic aquí
    </button>

</body>
</html>
